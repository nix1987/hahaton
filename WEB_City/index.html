<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ситидрайв — GAC GS3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="sheet">
    <header class="hero">
      <div class="hero__info">
        <p class="plate">C 091 CH 797</p>
        <h1 class="title">GAC GS3</h1>
        <a class="meta" href="#">
          <span class="meta__item">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M4 11.5A2.5 2.5 0 0 1 6.5 9H8V7.2A1.2 1.2 0 0 1 9.2 6h5.6A1.2 1.2 0 0 1 16 7.2V9h1.5A2.5 2.5 0 0 1 20 11.5v5A1.5 1.5 0 0 1 18.5 18h-1a1.5 1.5 0 0 1-1.5-1.5V16H8v.5A1.5 1.5 0 0 1 6.5 18h-1A1.5 1.5 0 0 1 4 16.5v-5Zm4-2.3V9h8V9.2H8ZM7.2 13.2a1.3 1.3 0 1 0 0-2.6 1.3 1.3 0 0 0 0 2.6Zm9.6 0a1.3 1.3 0 1 0 0-2.6 1.3 1.3 0 0 0 0 2.6Z"/>
            </svg>
            165 км
          </span>
          <span class="meta__item">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M12 5.2a1.8 1.8 0 1 0 0-3.6 1.8 1.8 0 0 0 0 3.6Zm-1.4 2.1 1.7 3.4 1.8-1.5 1.4 8.1-1.8.3-1-5.2-1.6 1.4v5.7H9.3v-6.6l1.3-2.6-1.9-1.1.8-1.5 1.1.6Z"/>
            </svg>
            4 мин
          </span>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m9 6 6 6-6 6"/>
          </svg>
        </a>
        <div class="autostart">
          <span class="autostart__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path fill="currentColor" d="M8.2 6.4A5.8 5.8 0 0 1 19 10.2l-1.5.7A4.2 4.2 0 0 0 9.4 7.7l-1.2-1.3Zm-2 2.2 1.3 1.2A4.2 4.2 0 0 0 8.8 16H6.2a6.6 6.6 0 0 1 0-7.4Zm8.3 3.2a2.2 2.2 0 0 1 1.1 1.9v.8h1.6v1.6h-7.4v-1.6h1.6v-.8a2.2 2.2 0 0 1 3.1-1.9Z"/>
            </svg>
          </span>
          Автозапуск
        </div>
      </div>

      <div class="hero__media">
        <img class="car" src="img/car.png" alt="GAC GS3 Ситидрайв" />
        <button class="btn btn--buy" type="button">Купить за 989 000</button>
        <button class="btn btn--ghost" type="button">Поиск по фото</button>
      </div>
    </header>

    <a class="insurance" href="#">
      <span class="insurance__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path fill="currentColor" d="M12 3.2 5.2 6v5.2c0 4.2 2.9 8.1 6.8 9.2 3.9-1.1 6.8-5 6.8-9.2V6L12 3.2Zm5.2 8c0 3.3-2.2 6.4-5.2 7.4-3-1-5.2-4.1-5.2-7.4V7.2L12 5l5.2 2.2V11.2Z"/>
          <path fill="currentColor" d="M6.2 17.8 17.8 6.2l1.2 1.2L7.4 19l-1.2-1.2Z"/>
        </svg>
      </span>
      <span class="insurance__text">
        <span class="insurance__title">Базовая страховка</span>
        <span class="insurance__sub">Полный штраф за ДТП</span>
        <span class="promo">«Турбокаско» без фотоосмотра</span>
      </span>
      <svg class="chevron chevron--lg" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m9 6 6 6-6 6"/>
      </svg>
    </a>

    <section class="tariffs" aria-label="Тарифы">
      <article class="card card--mint">
        <span class="badge">% Скидка 50%</span>
        <p class="old-price">17,86 ₽/мин</p>
        <p class="price">8,93 ₽/мин</p>
        <p class="card__caption">Поминутный</p>
      </article>
      <article class="card card--lilac">
        <span class="badge">% -50%</span>
        <p class="card__title">Фикс</p>
        <p class="card__caption">Цена до адреса</p>
      </article>
      <article class="card card--slate">
        <span class="badge">% -50%</span>
        <p class="card__title">Часы и дни</p>
        <p class="card__caption">От 213,69 ₽</p>
      </article>
    </section>
  </main>
</body>
</html>
